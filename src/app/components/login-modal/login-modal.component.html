


<p-dialog
    [(visible)]="visible"
    [modal]="true"
    [closable]="false"
    [dismissableMask]="true"
    [style]="{width: '420px'}"
    [contentStyle]="{padding: '0'}"
    styleClass="shadow-lg rounded-xl border border-gray-700 bg-gray-900">
    <ng-template pTemplate="header">
        <div class="flex flex-col items-center justify-center px-6 pt-6 pb-2 bg-gray-800 border-b border-gray-700 rounded-t-xl">
            <div class="flex items-center gap-2 mb-2">
                <i class="pi pi-user text-blue-400 text-xl"></i>
                <span class="font-bold text-white text-lg">
                    {{ isLoginMode ? '登入 CryptoExchange' : '註冊 CryptoExchange' }}
                </span>
            </div>
            <button type="button" (click)="closeModal(false)"
                title="關閉視窗"
                class="absolute top-3 right-3 px-3 py-1 rounded-md bg-gray-700 hover:bg-blue-600 text-white font-mono text-xs shadow focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200">
                <i class="pi pi-times" aria-hidden="true"></i>
                <span class="sr-only">關閉</span>
            </button>
        </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="px-6 pt-6 pb-2 space-y-5">
        <div>
            <label for="username" class="block text-gray-400 text-xs font-mono mb-1">帳號</label>
            <input pInputText id="username" formControlName="username" type="text"
                class="w-full px-4 py-3 rounded-lg border border-gray-700 bg-gray-950 text-white font-mono text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                autocomplete="username"
                (keyup.enter)="handleSubmit()">
        </div>
        <div>
            <label for="password" class="block text-gray-400 text-xs font-mono mb-1">密碼</label>
            <input pInputText id="password" formControlName="password" type="password"
                class="w-full px-4 py-3 rounded-lg border border-gray-700 bg-gray-950 text-white font-mono text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                autocomplete="current-password"
                (keyup.enter)="handleSubmit()">
        </div>
        <p-button
            type="submit"
            [disabled]="loading"
            [label]="loading ? '處理中...' : (isLoginMode ? '登入' : '註冊')"
            styleClass="w-full py-3 rounded-xl font-bold text-base bg-green-500 hover:bg-green-600 text-white shadow-md focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-all duration-200">
        </p-button>
        <div class="text-center mt-2">
            <a href="#" (click)="toggleMode()" class="text-blue-400 text-xs font-mono hover:text-blue-500 underline">
                {{ isLoginMode ? '還沒有帳號？註冊' : '已有帳號？登入' }}
            </a>
        </div>
    </form>

    <div class="px-6 pb-4 mt-2">
        <div *ngFor="let line of cmdOutput" [innerHTML]="line" class="font-mono text-xs text-green-400 mb-1"></div>
        <div class="font-mono text-xs text-green-400">C:\CryptoEx&gt; <span class="animate-pulse">_</span></div>
    </div>
</p-dialog>
